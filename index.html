                <div class="player-last">Выигр: $${formatCompact(p.lastWin)} · ${p.bestMult || 0}×</div>
              </div>
            </div>`;
        }).join('');
      }
    };

    /* ==========================================================================
       6. PLINKO HIGH-PERFORMANCE CANVAS 2D ENGINE (60 FPS, O(1) PHYSICS, POOLING)
       ========================================================================== */
    const ROWS = 16;
    const BUCKETS = 17;

    function getBucketStyle(index) {
      const dist = Math.abs(index - 8) / 8;
      if (dist >= 0.87) return { bg: '#E11D48', border: '#FDA4AF', text: '#FFFFFF', glow: 'rgba(244,63,94,0.65)' };
      if (dist >= 0.72) return { bg: '#DB2777', border: '#F9A8D4', text: '#FFFFFF', glow: 'rgba(219,39,119,0.55)' };
      if (dist >= 0.56) return { bg: '#EA580C', border: '#FDBA74', text: '#FFFFFF', glow: 'rgba(234,88,12,0.5)' };
      if (dist >= 0.37) return { bg: '#D97706', border: '#FDE68A', text: '#070B10', glow: 'rgba(245,158,11,0.45)' };
      if (dist >= 0.18) return { bg: '#CA8A04', border: '#FEF08A', text: '#070B10', glow: 'rgba(234,179,8,0.4)' };
      return { bg: '#92400E', border: '#FCD34D', text: '#FEF3C7', glow: 'rgba(245,197,66,0.35)' };
    }

    class PlinkoEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: true });

        this.width = 0;
        this.height = 0;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.startY = 0;
        this.rowSpacing = 0;
        this.colSpacing = 0;
        this.pinRadius = 3;
        this.ballRadius = 5.5;
        this.bucketY = 0;
        this.bucketH = 26;
        this.pinsByRow = [];

        this.staticCanvas = document.createElement('canvas');
        this.staticCtx = this.staticCanvas.getContext('2d');
        this.normalBallSprite = document.createElement('canvas');
        this.freeBallSprite = document.createElement('canvas');

        this.balls = [];
        this.ballPool = [];
        this.ripples = [];
        this.ripplePool = [];
        this.floatTexts = [];
        this.floatTextPool = [];
        this.particles = [];
        this.particlePool = [];

        this.bucketAnim = Array.from({ length: BUCKETS }, () => ({ y: 0, vy: 0, flash: 0 }));

        this.activeRounds = new Map();
        this.spawnQueue = [];
        this.roundCounter = 1;

        this.shakeTime = 0;
        this.shakeMag = 0;

        this.lastFrameTime = 0;
        this.accumulator = 0;
        this.fixedDt = 1 / 120;
        this.running = false;
        this.rafId = null;

        this.resize();
      }

      resize() {
        const parent = this.canvas.parentElement;
        if (!parent) return;
        const rect = parent.getBoundingClientRect();
        const nextW = Math.max(260, rect.width);
        const nextH = Math.max(210, rect.height);
        if (Math.abs(nextW - this.width) < 1 && Math.abs(nextH - this.height) < 1 && this.pinsByRow.length > 0) {
          return;
        }

        this.width = nextW;
        this.height = nextH;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.canvas.width = Math.round(this.width * this.dpr);
        this.canvas.height = Math.round(this.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

        const padX = Math.max(12, this.width * 0.04);
        const usableW = this.width - padX * 2;
        this.colSpacing = usableW / 17.6;

        this.bucketH = Math.max(22, Math.min(28, this.height * 0.075));
        const topMargin = Math.max(16, this.height * 0.045);
        const bottomMargin = this.bucketH + 16;
        const usableH = this.height - topMargin - bottomMargin;
        this.rowSpacing = usableH / ROWS;

        this.startY = topMargin;
        this.bucketY = this.startY + ROWS * this.rowSpacing + 4;

        this.pinRadius = Math.max(2.1, Math.min(3.5, this.colSpacing * 0.165));
        this.ballRadius = Math.max(3.8, Math.min(6.4, this.colSpacing * 0.285));

        this.pinsByRow = [];
        const cx = this.width * 0.5;
        for (let r = 0; r < ROWS; r++) {
          const count = r + 3;
          const rowWidth = (count - 1) * this.colSpacing;
          const leftX = cx - rowWidth * 0.5;
          const y = this.startY + r * this.rowSpacing;
          const rowPins = [];
          for (let c = 0; c < count; c++) {
            rowPins.push({ x: leftX + c * this.colSpacing, y, flash: 0 });
          }
          this.pinsByRow.push(rowPins);
        }

        this.prerenderStaticLayer();
        this.prerenderBallSprites();
      }

      prerenderStaticLayer() {
        this.staticCanvas.width = Math.round(this.width * this.dpr);
        this.staticCanvas.height = Math.round(this.height * this.dpr);
        const sctx = this.staticCtx;
        sctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        sctx.clearRect(0, 0, this.width, this.height);

        const grad = sctx.createRadialGradient(
          this.width * 0.5, this.height * 0.45, 10,
          this.width * 0.5, this.height * 0.48, this.width * 0.65
        );
        grad.addColorStop(0, 'rgba(245, 197, 66, 0.08)');
        grad.addColorStop(0.55, 'rgba(16, 185, 129, 0.04)');
        grad.addColorStop(1, 'rgba(7, 11, 16, 0)');
        sctx.fillStyle = grad;
        sctx.fillRect(0, 0, this.width, this.height);

        for (let r = 0; r < ROWS; r++) {
          const row = this.pinsByRow[r];
          for (let c = 0; c < row.length; c++) {
            const p = row[c];
            sctx.beginPath();
            sctx.arc(p.x, p.y, this.pinRadius * 1.65, 0, Math.PI * 2);
            sctx.fillStyle = 'rgba(245, 197, 66, 0.09)';
            sctx.fill();

            const pg = sctx.createRadialGradient(
              p.x - this.pinRadius * 0.35, p.y - this.pinRadius * 0.35, 0.2,
              p.x, p.y, this.pinRadius
            );
            pg.addColorStop(0, '#FFFFFF');
            pg.addColorStop(0.55, '#E2E8F0');
            pg.addColorStop(1, '#64748B');
            sctx.beginPath();
            sctx.arc(p.x, p.y, this.pinRadius, 0, Math.PI * 2);
            sctx.fillStyle = pg;
            sctx.fill();
          }
        }
      }

      prerenderBallSprites() {
        const size = Math.ceil((this.ballRadius * 3.4) * this.dpr);
        const half = size / 2;
        const r = this.ballRadius * this.dpr;

        this.normalBallSprite.width = size;
        this.normalBallSprite.height = size;
        const nctx = this.normalBallSprite.getContext('2d');
        nctx.clearRect(0, 0, size, size);

        const nGlow = nctx.createRadialGradient(half, half, r * 0.3, half, half, r * 1.65);
        nGlow.addColorStop(0, 'rgba(245, 197, 66, 0.55)');
        nGlow.addColorStop(1, 'rgba(245, 197, 66, 0)');
        nctx.fillStyle = nGlow;
        nctx.beginPath();
        nctx.arc(half, half, r * 1.65, 0, Math.PI * 2);
        nctx.fill();

        const nBody = nctx.createRadialGradient(half - r * 0.35, half - r * 0.35, r * 0.1, half, half, r);
        nBody.addColorStop(0, '#FFFBEB');
        nBody.addColorStop(0.35, '#F5C542');
        nBody.addColorStop(0.8, '#D97706');
        nBody.addColorStop(1, '#78350F');
        nctx.fillStyle = nBody;
        nctx.beginPath();
        nctx.arc(half, half, r, 0, Math.PI * 2);
        nctx.fill();

        nctx.fillStyle = 'rgba(255,255,255,0.85)';
        nctx.beginPath();
        nctx.arc(half - r * 0.32, half - r * 0.32, r * 0.24, 0, Math.PI * 2);
        nctx.fill();

        this.freeBallSprite.width = size;
        this.freeBallSprite.height = size;
        const fctx = this.freeBallSprite.getContext('2d');
        fctx.clearRect(0, 0, size, size);

        const fGlow = fctx.createRadialGradient(half, half, r * 0.3, half, half, r * 1.7);
        fGlow.addColorStop(0, 'rgba(52, 211, 153, 0.72)');
        fGlow.addColorStop(0.55, 'rgba(252, 227, 138, 0.3)');
        fGlow.addColorStop(1, 'rgba(52, 211, 153, 0)');
        fctx.fillStyle = fGlow;
        fctx.beginPath();
        fctx.arc(half, half, r * 1.7, 0, Math.PI * 2);
        fctx.fill();

        const fBody = fctx.createRadialGradient(half - r * 0.35, half - r * 0.35, r * 0.1, half, half, r);
        fBody.addColorStop(0, '#FFFFFF');
        fBody.addColorStop(0.3, '#A7F3D0');
        fBody.addColorStop(0.7, '#10B981');
        fBody.addColorStop(1, '#065F46');
        fctx.fillStyle = fBody;
        fctx.beginPath();
        fctx.arc(half, half, r, 0, Math.PI * 2);
        fctx.fill();

        fctx.strokeStyle = '#FCE38A';
        fctx.lineWidth = Math.max(1, r * 0.14);
        fctx.stroke();
      }

      launchRound({ count, betPerBall, risk, isFreeBet }) {
        const roundId = this.roundCounter++;
        this.activeRounds.set(roundId, {
          roundId,
          totalBalls: count,
          landedBalls: 0,
          totalBet: betPerBall * count,
          totalWin: 0,
          bestMult: 0,
          isFreeBet,
          risk
        });

        const intervalMs = count > 50 ? 25 : count > 15 ? 36 : 52;
        const now = performance.now();
        for (let i = 0; i < count; i++) {
          this.spawnQueue.push({
            spawnAt: now + i * intervalMs,
            betAmount: betPerBall,
            riskProfile: risk,
            roundId,
            isFreeBet
          });
        }
      }

      spawnBall(item) {
        const b = this.ballPool.pop() || { trail: [] };
        const jitter = (Math.random() - 0.5) * this.colSpacing * 0.55;
        b.x = this.width * 0.5 + jitter;
        b.y = Math.max(4, this.startY - this.rowSpacing * 0.72);
        b.vx = (Math.random() - 0.5) * 18;
        b.vy = 20;
        b.betAmount = item.betAmount;
        b.riskProfile = item.riskProfile;
        b.roundId = item.roundId;
        b.isFreeBet = item.isFreeBet;
        b.trail.length = 0;
        this.balls.push(b);
      }

      addRipple(x, y) {
        const rp = this.ripplePool.pop() || {};
        rp.x = x;
        rp.y = y;
        rp.r = this.pinRadius;
        rp.alpha = 0.85;
        this.ripples.push(rp);
      }

      addFloatText(x, y, text, color, isBig) {
        if (this.floatTexts.length > 35) return;
        const ft = this.floatTextPool.pop() || {};
        ft.x = x;
        ft.y = y;
        ft.text = text;
        ft.color = color;
        ft.alpha = 1;
        ft.vy = isBig ? -44 : -32;
        ft.scale = isBig ? 1.25 : 1;
        this.floatTexts.push(ft);
      }

      addBurstParticles(x, y, color, count) {
        const cap = Math.min(count, 80 - this.particles.length);
        for (let i = 0; i < cap; i++) {
          const p = this.particlePool.pop() || {};
          const ang = -Math.PI * Math.random();
          const spd = 60 + Math.random() * 140;
          p.x = x;
          p.y = y;
          p.vx = Math.cos(ang) * spd;
          p.vy = Math.sin(ang) * spd - 40;
          p.color = color;
          p.alpha = 1;
          p.size = 2 + Math.random() * 2.5;
          this.particles.push(p);
        }
      }

      settleAllPendingImmediately() {
        while (this.spawnQueue.length > 0) {
          const item = this.spawnQueue.pop();
          const idx = this.simulateBinomialBucket();
          this.resolveBallLanding(item.betAmount, item.riskProfile, item.roundId, item.isFreeBet, idx, true);
        }
        while (this.balls.length > 0) {
          const b = this.balls.pop();
          const idx = this.estimateBucketFromX(b.x);
          this.resolveBallLanding(b.betAmount, b.riskProfile, b.roundId, b.isFreeBet, idx, true);
          this.ballPool.push(b);
        }
        saveState();
      }

      simulateBinomialBucket() {
        let right = 0;
        for (let i = 0; i < ROWS; i++) {
          if (Math.random() < 0.5) right++;
        }
        return right;
      }

      estimateBucketFromX(x) {
        const lastRow = this.pinsByRow[ROWS - 1];
        if (!lastRow || !lastRow.length) return 8;
        const leftEdge = lastRow[0].x;
        const idx = Math.floor((x - leftEdge) / this.colSpacing);
        return Math.max(0, Math.min(BUCKETS - 1, idx));
      }

      start() {
        if (this.running) return;
        this.running = true;
        this.lastFrameTime = performance.now();
        const loop = (now) => {
          if (!this.running) return;
          const dt = Math.min(0.05, (now - this.lastFrameTime) / 1000);
          this.lastFrameTime = now;

          this.processSpawnQueue(now);
          this.accumulator += dt;
          while (this.accumulator >= this.fixedDt) {
            this.stepPhysics(this.fixedDt);
            this.accumulator -= this.fixedDt;
          }
          this.stepEffects(dt);
          this.render();
          this.rafId = requestAnimationFrame(loop);
        };
        this.rafId = requestAnimationFrame(loop);
      }

      stop() {
        this.running = false;
        if (this.rafId) cancelAnimationFrame(this.rafId);
      }

      processSpawnQueue(now) {
        while (this.spawnQueue.length > 0 && this.spawnQueue[0].spawnAt <= now) {
          const next = this.spawnQueue.shift();
          this.spawnBall(next);
        }
      }

      stepPhysics(dt) {
        const gravity = this.height * 2.55;
        const minDist = this.pinRadius + this.ballRadius;
        const minDistSq = minDist * minDist;
        const restitution = 0.48;
        const cx = this.width * 0.5;

        for (let i = this.balls.length - 1; i >= 0; i--) {
          const b = this.balls[i];

          b.vy += gravity * dt;
          b.vx *= 0.996;
          b.x += b.vx * dt;
          b.y += b.vy * dt;

          const progressY = Math.max(0, (b.y - this.startY) / (ROWS * this.rowSpacing));
          const halfSpan = ((2 + progressY * ROWS) * 0.5 + 0.55) * this.colSpacing;
          if (b.x < cx - halfSpan) {
            b.x = cx - halfSpan;
            b.vx = Math.abs(b.vx) * 0.5 + 15;
          } else if (b.x > cx + halfSpan) {
            b.x = cx + halfSpan;
            b.vx = -Math.abs(b.vx) * 0.5 - 15;
          }

          const approxRow = Math.round((b.y - this.startY) / this.rowSpacing);
          if (approxRow >= 0 && approxRow < ROWS) {
            const rowPins = this.pinsByRow[approxRow];
            const firstX = rowPins[0].x;
            const approxCol = Math.round((b.x - firstX) / this.colSpacing);

            for (let dc = -1; dc <= 1; dc++) {
              const cIdx = approxCol + dc;
              if (cIdx < 0 || cIdx >= rowPins.length) continue;
              const pin = rowPins[cIdx];
              const dx = b.x - pin.x;
              const dy = b.y - pin.y;
              const distSq = dx * dx + dy * dy;

              if (distSq < minDistSq) {
                const dist = Math.sqrt(distSq) || 0.001;
                const nx = dx / dist;
                const ny = dy / dist;

                b.x = pin.x + nx * minDist;
                b.y = pin.y + ny * minDist;

                const dot = b.vx * nx + b.vy * ny;
                if (dot < 0) {
                  b.vx -= (1 + restitution) * dot * nx;
                  b.vy -= (1 + restitution) * dot * ny;
                }

                const nudge = (Math.random() < 0.5 ? -1 : 1) * (this.colSpacing * 0.42 + Math.random() * 14);
                if (Math.abs(dx) < 1.2) {
                  b.vx += nudge;
                } else {
                  b.vx += (Math.random() - 0.5) * this.colSpacing * 0.6;
                }

                const maxVx = this.colSpacing * 4.2;
                if (b.vx > maxVx) b.vx = maxVx;
                if (b.vx < -maxVx) b.vx = -maxVx;

                pin.flash = 1;
                this.addRipple(pin.x, pin.y);
                audio.playPinHit(approxRow);
              }
            }
          }

          if (b.y >= this.bucketY) {
            const bucketIdx = this.estimateBucketFromX(b.x);
            this.resolveBallLanding(b.betAmount, b.riskProfile, b.roundId, b.isFreeBet, bucketIdx, false);
            this.balls.splice(i, 1);
            this.ballPool.push(b);
          }
        }
      }

      resolveBallLanding(betAmount, riskProfile, roundId, isFreeBet, bucketIdx, silent) {
        const mult = RISK_TABLES[riskProfile][bucketIdx];
        const winAmount = betAmount * mult;

        state.balance += winAmount;
        state.stats.totalWon += winAmount;
        state.stats.totalBalls += 1;
        if (mult > state.stats.maxMultiplier) {
          state.stats.maxMultiplier = mult;
        }

        const round = this.activeRounds.get(roundId);
        if (round) {
          round.landedBalls += 1;
          round.totalWin += winAmount;
          if (mult > round.bestMult) round.bestMult = mult;

          if (round.landedBalls >= round.totalBalls) {
            if (round.totalWin > state.stats.maxRoundWin) {
              state.stats.maxRoundWin = round.totalWin;
            }
            state.stats.lastBet = round.totalBet;
            state.stats.lastWin = round.totalWin;
            this.activeRounds.delete(roundId);

            if (!silent) {
              OnlineService.syncPlayerBet(round.totalBet, round.totalWin, round.bestMult);
            }
          }
        }

        if (!silent) {
          const ba = this.bucketAnim[bucketIdx];
          ba.vy = 115;
          ba.flash = 1;

          const lastRow = this.pinsByRow[ROWS - 1];
          const bx = lastRow[0].x + (bucketIdx + 0.5) * this.colSpacing;
          const isBig = mult >= 10;
          this.addFloatText(
            bx,
            this.bucketY - 6,
            `+$${formatCompact(winAmount)}`,
            isBig ? '#FCE38A' : (mult >= 1 ? '#34D399' : '#94A3B8'),
            isBig
          );

          audio.playBucketHit(mult);
          pushHistoryChip(mult);

          if (isBig) {
            this.shakeTime = 0.24;
            this.shakeMag = mult >= 100 ? 6 : 3.5;
            this.addBurstParticles(bx, this.bucketY, '#F5C542', 18);
            triggerJackpotFX(mult);
            Haptic.success();
          }

          animateBalanceTo(state.balance);
          updateBonusButtonVisibility();
          updateDropButtonState();
          checkQuestNotifications();
          saveState();
        }
      }

      stepEffects(dt) {
        for (let i = 0; i < this.balls.length; i++) {
          const b = this.balls[i];
          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 6) b.trail.shift();
        }

        for (let r = 0; r < ROWS; r++) {
          const row = this.pinsByRow[r];
          for (let c = 0; c < row.length; c++) {
            if (row[c].flash > 0) row[c].flash = Math.max(0, row[c].flash - dt * 5.5);
          }
        }

        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const rp = this.ripples[i];
          rp.r += dt * 42;
          rp.alpha -= dt * 3.8;
          if (rp.alpha <= 0) {
            this.ripples.splice(i, 1);
            this.ripplePool.push(rp);
          }
        }

        for (let i = 0; i < BUCKETS; i++) {
          const ba = this.bucketAnim[i];
          if (ba.y !== 0 || ba.vy !== 0) {
            const spring = -260 * ba.y;
            const damping = -18 * ba.vy;
            ba.vy += (spring + damping) * dt;
            ba.y += ba.vy * dt;
            if (Math.abs(ba.y) < 0.08 && Math.abs(ba.vy) < 0.5) {
              ba.y = 0;
              ba.vy = 0;
            }
          }
          if (ba.flash > 0) ba.flash = Math.max(0, ba.flash - dt * 4);
        }

        for (let i = this.floatTexts.length - 1; i >= 0; i--) {
          const ft = this.floatTexts[i];
          ft.y += ft.vy * dt;
          ft.alpha -= dt * 1.15;
          if (ft.alpha <= 0) {
            this.floatTexts.splice(i, 1);
            this.floatTextPool.push(ft);
          }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.vy += 380 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.alpha -= dt * 1.6;
          if (p.alpha <= 0) {
            this.particles.splice(i, 1);
            this.particlePool.push(p);
          }
        }

        if (this.shakeTime > 0) {
          this.shakeTime = Math.max(0, this.shakeTime - dt);
        }
      }

      render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        ctx.save();
        if (this.shakeTime > 0) {
          const sx = (Math.random() - 0.5) * this.shakeMag * 2;
          const sy = (Math.random() - 0.5) * this.shakeMag * 2;
          ctx.translate(sx, sy);
        }

        ctx.drawImage(this.staticCanvas, 0, 0, this.width, this.height);

        for (let r = 0; r < ROWS; r++) {
          const row = this.pinsByRow[r];
          for (let c = 0; c < row.length; c++) {
            const p = row[c];
            if (p.flash > 0.02) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, this.pinRadius * 1.8, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(252, 227, 138, ${p.flash * 0.75})`;
              ctx.fill();
            }
          }
        }

        for (let i = 0; i < this.ripples.length; i++) {
          const rp = this.ripples[i];
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(245, 197, 66, ${rp.alpha * 0.65})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        this.renderBuckets(ctx);

        const spriteSize = this.ballRadius * 3.4;
        const halfSprite = spriteSize * 0.5;
        for (let i = 0; i < this.balls.length; i++) {
          const b = this.balls[i];
          const tLen = b.trail.length;
          if (tLen > 1) {
            for (let t = 0; t < tLen - 1; t++) {
              const pt = b.trail[t];
              const ratio = (t + 1) / tLen;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, this.ballRadius * ratio * 0.75, 0, Math.PI * 2);
              ctx.fillStyle = b.isFreeBet
                ? `rgba(52, 211, 153, ${ratio * 0.28})`
                : `rgba(245, 197, 66, ${ratio * 0.25})`;
              ctx.fill();
            }
          }
          const sprite = b.isFreeBet ? this.freeBallSprite : this.normalBallSprite;
          ctx.drawImage(sprite, b.x - halfSprite, b.y - halfSprite, spriteSize, spriteSize);
        }

        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < this.floatTexts.length; i++) {
          const ft = this.floatTexts[i];
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.font = `800 ${Math.round(11 * ft.scale)}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.fillStyle = '#070B10';
          ctx.fillText(ft.text, ft.x + 1, ft.y + 1);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore();
      }

      renderBuckets(ctx) {
        const mults = RISK_TABLES[state.risk];
        const lastRow = this.pinsByRow[ROWS - 1];
        if (!lastRow || !lastRow.length) return;
        const leftEdge = lastRow[0].x;
        const gap = Math.max(1.5, this.colSpacing * 0.1);
        const bw = this.colSpacing - gap;
        const bh = this.bucketH;
        const fontSize = Math.max(7.5, Math.min(10.5, bw * 0.44));

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;

        for (let i = 0; i < BUCKETS; i++) {
          const ba = this.bucketAnim[i];
          const x = leftEdge + i * this.colSpacing + gap * 0.5;
          const y = this.bucketY + ba.y;
          const style = getBucketStyle(i);

          const r = Math.min(5, bw * 0.25);
          drawRoundedRect(ctx, x, y, bw, bh, r);
          ctx.fillStyle = style.bg;
          ctx.fill();

          if (ba.flash > 0.02) {
            ctx.fillStyle = `rgba(255, 255, 255, ${ba.flash * 0.55})`;
            ctx.fill();
          }

          ctx.strokeStyle = style.border;
          ctx.lineWidth = 0.8;
          ctx.stroke();

          const m = mults[i];
          const label = m >= 1000 ? '1K' : String(m);
          ctx.fillStyle = style.text;
          ctx.fillText(label, x + bw * 0.5, y + bh * 0.52);
        }
      }
    }

    /* ==========================================================================
       7. UI CONTROLLERS, FREE BETS, QUESTS, BONUS & FX
       ========================================================================== */
    let engine = null;

    function showToast(text, icon = '✨') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast-item';
      el.innerHTML = `<span>${icon}</span><span>${escapeHtml(text)}</span>`;
      container.appendChild(el);

      if (typeof gsap !== 'undefined') {
        gsap.fromTo(el, { y: -16, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.28, ease: 'back.out(1.6)' });
        setTimeout(() => {
          gsap.to(el, { y: -12, opacity: 0, duration: 0.25, onComplete: () => el.remove() });
        }, 2600);
      } else {
        setTimeout(() => el.remove(), 2600);
      }
    }

    function triggerJackpotFX(mult) {
      const vig = document.getElementById('jackpot-vignette');
      if (typeof gsap !== 'undefined') {
        gsap.killTweensOf(vig);
        gsap.fromTo(vig, { opacity: 0.9 }, { opacity: 0, duration: 0.7, ease: 'power2.out' });
      }

      if (typeof confetti === 'function') {
        try {
          confetti({
            particleCount: mult >= 100 ? 75 : 35,
            spread: mult >= 100 ? 80 : 55,
            origin: { y: 0.68 },
            colors: ['#FCE38A', '#F5C542', '#10B981', '#F43F5E'],
            disableForReducedMotion: true
          });
        } catch (_) {}
      }
    }

    function animateBalanceTo(target) {
      const el = document.getElementById('balance-display');
      if (typeof gsap === 'undefined') {
        displayedBalance = target;
        el.textContent = formatMoney(target);
        return;
      }
      if (balanceTween) balanceTween.kill();
      const obj = { val: displayedBalance };
      balanceTween = gsap.to(obj, {
        val: target,
        duration: 0.35,
        ease: 'power2.out',
        onUpdate: () => {
          displayedBalance = obj.val;
          el.textContent = formatMoney(displayedBalance);
        },
        onComplete: () => {
          displayedBalance = target;
          el.textContent = formatMoney(target);
        }
      });
    }

    function updateBonusButtonVisibility() {
      const btn = document.getElementById('bonus-btn');
      if (state.balance < 5000) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }

    function pushHistoryChip(mult) {
      state.history.unshift(mult);
      if (state.history.length > 8) state.history.pop();
      renderHistoryChips(true);
    }

    function renderHistoryChips(animateFirst = false) {
      const wrap = document.getElementById('history-chips');
      wrap.innerHTML = state.history.map(m => {
        const bg = m >= 10 ? '#E11D48' : m >= 2 ? '#D97706' : m >= 1 ? '#0F766E' : 'rgba(255,255,255,0.08)';
        const col = m >= 1 ? '#FFFFFF' : '#94A3B8';
        return `<span class="hist-chip tabular" style="background:${bg};color:${col};">${m}×</span>`;
      }).join('');
      if (animateFirst && wrap.firstElementChild && typeof gsap !== 'undefined') {
        gsap.fromTo(wrap.firstElementChild, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: 'back.out(2)' });
      }
    }

    /* Управление билетами (Фри-ставками) */
    function getAvailableTicketNominals() {
      return Object.keys(state.tickets)
        .map(Number)
        .filter(n => (state.tickets[n] || 0) > 0)
        .sort((a, b) => b - a);
    }

    function ensureValidFreeBetState() {
      const nominals = getAvailableTicketNominals();
      if (nominals.length === 0) {
        state.freeBetMode = false;
        state.activeTicketNominal = null;
      } else if (!state.activeTicketNominal || !(state.tickets[state.activeTicketNominal] > 0)) {
        state.activeTicketNominal = nominals[0];
      }
    }

    function updateFreeBetUI() {
      ensureValidFreeBetState();
      const btn = document.getElementById('freebet-toggle');
      const label = document.getElementById('freebet-label');
      const betRow = document.getElementById('bet-row');
      const nominals = getAvailableTicketNominals();

      if (nominals.length === 0) {
        btn.classList.remove('visible', 'active');
        betRow.classList.remove('disabled');
        return;
      }

      const nom = state.activeTicketNominal;
      const cnt = state.tickets[nom] || 0;
      btn.classList.add('visible');
      btn.classList.toggle('active', state.freeBetMode);
      label.textContent = `$${formatCompact(nom)} × ${cnt}`;
      betRow.classList.toggle('disabled', state.freeBetMode);
    }

    function updateDropButtonState() {
      const btn = document.getElementById('drop-btn');
      const title = document.getElementById('drop-btn-title');
      const sub = document.getElementById('drop-btn-total');

      if (state.freeBetMode && state.activeTicketNominal && state.tickets[state.activeTicketNominal] > 0) {
        const nom = state.activeTicketNominal;
        btn.classList.add('free-mode');
        btn.classList.remove('insufficient');
        title.textContent = '🎟️ ФРИ-СТАВКА';
        sub.textContent = `$${formatMoney(nom)} ($0)`;
      } else {
        btn.classList.remove('free-mode');
        const total = state.betPerBall * state.ballCount;
        const canAfford = state.balance >= total && state.betPerBall >= 5;
        btn.classList.toggle('insufficient', !canAfford);
        title.textContent = canAfford ? 'СБРОСИТЬ' : 'НЕДОСТАТОЧНО';
        sub.textContent = `$${formatMoney(total)}`;
      }
    }

    function updateBallsUI() {
      document.getElementById('balls-slider').value = state.ballCount;
      document.getElementById('balls-count-label').textContent = pluralBalls(state.ballCount);
      document.querySelectorAll('#balls-presets .preset-chip').forEach(ch => {
        ch.classList.toggle('active', Number(ch.dataset.balls) === state.ballCount);
      });
      updateDropButtonState();
    }

    function updateRiskUI() {
      document.querySelectorAll('#risk-segmented .risk-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.risk === state.risk);
      });
    }

    function updateSoundIcon() {
      const svg = document.getElementById('sound-icon-svg');
      if (state.soundMode === 'mute') {
        svg.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>`;
        svg.style.color = '#64748B';
      } else if (state.soundMode === 'sfx') {
        svg.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
        svg.style.color = '#34D399';
      } else {
        svg.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>`;
        svg.style.color = '#FCE38A';
      }
    }

    /* ==========================================================================
       8. QUESTS SYSTEM & REWARD CLAIMING
       ========================================================================== */
    function getClaimableQuestsCount() {
      let cnt = 0;
      for (const q of QUEST_DEFINITIONS) {
        if (!state.claimedQuests[q.id] && q.getProgress(state) >= q.target) {
          cnt++;
        }
      }
      return cnt;
    }

    function checkQuestNotifications() {
      let newlyCompleted = 0;
      for (const q of QUEST_DEFINITIONS) {
        if (!state.claimedQuests[q.id] && q.getProgress(state) >= q.target) {
          if (!state.notifiedQuests[q.id]) {
            state.notifiedQuests[q.id] = true;
            newlyCompleted++;
            showToast(`Задание «${q.title}» выполнено! Заберите награду`, '🏆');
            Haptic.success();
          }
        }
      }
      updateQuestBadge();
      if (newlyCompleted > 0) saveState();
    }

    function updateQuestBadge() {
      const cnt = getClaimableQuestsCount();
      const badge = document.getElementById('quest-badge');
      const btn = document.getElementById('quests-btn');
      badge.textContent = cnt;
      badge.classList.toggle('visible', cnt > 0);
      btn.classList.toggle('has-alert', cnt > 0);
    }

    function renderQuestsModal() {
      const list = document.getElementById('quests-list');
      const tBar = document.getElementById('quests-tickets-bar');
      const tList = document.getElementById('quests-tickets-list');

      const nominals = getAvailableTicketNominals();
      if (nominals.length > 0) {
        tBar.style.display = 'flex';
        tList.textContent = nominals.map(n => `$${formatCompact(n)} × ${state.tickets[n]}`).join(' · ');
      } else {
        tBar.style.display = 'none';
      }

      list.innerHTML = QUEST_DEFINITIONS.map(q => {
        const cur = q.getProgress(state);
        const pct = Math.min(100, (cur / q.target) * 100);
        const claimed = Boolean(state.claimedQuests[q.id]);
        const ready = !claimed && cur >= q.target;

        return `
          <div class="quest-card ${ready ? 'ready' : ''} ${claimed ? 'claimed' : ''}">
            <div class="quest-top">
              <div>
                <div class="quest-name">${q.title}</div>
                <div class="quest-desc">${q.desc}</div>
              </div>
              <div class="quest-reward-tag">${q.rewardLabel}</div>
            </div>
            <div class="quest-progress-row">
              <div class="quest-bar-bg">
                <div class="quest-bar-fill" style="width:${pct.toFixed(1)}%;"></div>
              </div>
              <div class="quest-pct tabular">${q.formatVal(Math.min(cur, q.target))} / ${q.formatVal(q.target)}</div>
            </div>
            ${ready
              ? `<button type="button" class="quest-claim-btn" data-claim-quest="${q.id}">Забрать награду</button>`
              : claimed
                ? `<div class="quest-status-pill">✓ Выполнено</div>`
                : ''
            }
          </div>`;
      }).join('');
    }

    function claimQuestReward(questId) {
      const q = QUEST_DEFINITIONS.find(x => x.id === questId);
      if (!q || state.claimedQuests[questId] || q.getProgress(state) < q.target) return;

      state.claimedQuests[questId] = true;
      if (q.reward.type === 'cash') {
        state.balance += q.reward.amount;
        animateBalanceTo(state.balance);
        showToast(`Начислено +$${formatMoney(q.reward.amount)}!`, '💰');
      } else if (q.reward.type === 'tickets') {
        const nom = q.reward.nominal;
        state.tickets[nom] = (state.tickets[nom] || 0) + q.reward.count;
        state.activeTicketNominal = nom;
        showToast(`Получено ${q.reward.count} фри-ставок по $${formatCompact(nom)}!`, '🎟️');
      }

      audio.playCoinBonus();
      Haptic.success();
      if (typeof confetti === 'function') {
        try {
          confetti({ particleCount: 55, spread: 70, origin: { y: 0.6 }, colors: ['#FCE38A', '#F5C542', '#10B981'] });
        } catch (_) {}
      }

      updateBonusButtonVisibility();
      updateFreeBetUI();
      updateDropButtonState();
      updateQuestBadge();
      renderQuestsModal();
      saveState();
    }

    /* ==========================================================================
       9. MODALS ANIMATION (GSAP BOTTOM-SHEET WITH FALLBACK)
       ========================================================================== */
    function openModal(modalId) {
      const backdrop = document.getElementById(modalId);
      const sheet = backdrop.querySelector('.bottom-sheet');
      backdrop.classList.add('open');
      if (typeof gsap !== 'undefined') {
        gsap.killTweensOf([backdrop, sheet]);
        gsap.to(backdrop, { opacity: 1, duration: 0.22 });
        gsap.to(sheet, { y: '0%', duration: 0.3, ease: 'power3.out' });
      } else {
        backdrop.style.opacity = '1';
        sheet.style.transform = 'translateY(0%)';
      }
    }

    function closeModal(modalId) {
      const backdrop = document.getElementById(modalId);
      const sheet = backdrop.querySelector('.bottom-sheet');
      if (typeof gsap !== 'undefined') {
        gsap.killTweensOf([backdrop, sheet]);
        gsap.to(sheet, { y: '100%', duration: 0.22, ease: 'power2.in' });
        gsap.to(backdrop, {
          opacity: 0, duration: 0.22,
          onComplete: () => backdrop.classList.remove('open')
        });
      } else {
        backdrop.style.opacity = '0';
        sheet.style.transform = 'translateY(100%)';
        backdrop.classList.remove('open');
      }
    }

    /* ==========================================================================
       10. PROFILE RENDERING & FULL UI SYNC
       ========================================================================== */
    function initProfileUI() {
      const nameEl = document.getElementById('user-name');
      const avatarWrap = document.getElementById('user-avatar-wrap');
      const fallback = document.getElementById('user-avatar-fallback');

      if (tgUser) {
        const displayName = tgUser.first_name
          ? (tgUser.last_name ? `${tgUser.first_name} ${tgUser.last_name}` : tgUser.first_name)
          : (tgUser.username ? `@${tgUser.username}` : `Игрок #${tgUser.id}`);
        nameEl.textContent = displayName;
        const initials = displayName.replace(/^@/, '').trim().slice(0, 2).toUpperCase() || 'VIP';
        fallback.textContent = initials;

        if (tgUser.photo_url) {
          const img = document.createElement('img');
          img.className = 'avatar-img';
          img.src = tgUser.photo_url;
          img.alt = '';
          img.onerror = () => {
            avatarWrap.innerHTML = '';
            avatarWrap.appendChild(fallback);
          };
          avatarWrap.innerHTML = '';
          avatarWrap.appendChild(img);
        }
      } else {
        nameEl.textContent = 'Гость';
        fallback.textContent = 'Г';
      }
    }

    function syncAllUI() {
      document.getElementById('balance-display').textContent = formatMoney(state.balance);
      document.getElementById('bet-input').value = state.betPerBall;
      updateBonusButtonVisibility();
      updateRiskUI();
      updateBallsUI();
      updateFreeBetUI();
      updateDropButtonState();
      updateQuestBadge();
      updateSoundIcon();
      renderHistoryChips(false);
    }

    /* ==========================================================================
       11. EVENT LISTENERS & BOOTSTRAP
       ========================================================================== */
    function bindEvents() {
      // Разблокировка Web Audio API при первом касании
      const unlockOnce = () => {
        audio.unlock();
        window.removeEventListener('pointerdown', unlockOnce);
        window.removeEventListener('touchstart', unlockOnce);
      };
      window.addEventListener('pointerdown', unlockOnce, { passive: true });
      window.addEventListener('touchstart', unlockOnce, { passive: true });

      // Переключение риска
      document.getElementById('risk-segmented').addEventListener('click', e => {
        const btn = e.target.closest('.risk-btn');
        if (!btn) return;
        audio.playClick();
        Haptic.light();
        state.risk = btn.dataset.risk;
        updateRiskUI();
        saveState();
      });

      // Переключатель фри-ставки (циклический выбор номинала / вкл-выкл)
      document.getElementById('freebet-toggle').addEventListener('click', () => {
        audio.playClick();
        Haptic.light();
        const nominals = getAvailableTicketNominals();
        if (!nominals.length) return;

        if (!state.freeBetMode) {
          state.freeBetMode = true;
          state.activeTicketNominal = nominals[0];
        } else {
          const idx = nominals.indexOf(state.activeTicketNominal);
          if (idx >= 0 && idx < nominals.length - 1) {
            state.activeTicketNominal = nominals[idx + 1];
          } else {
            state.freeBetMode = false;
          }
        }
        updateFreeBetUI();
        updateDropButtonState();
        saveState();
      });

      // Поле ввода ставки ($5 - безлимит)
      const betInput = document.getElementById('bet-input');
      betInput.addEventListener('focus', () => {
        window.scrollTo(0, 0);
      });
      betInput.addEventListener('input', () => {
        const v = Math.floor(Number(betInput.value) || 0);
        state.betPerBall = Math.max(0, v);
        updateDropButtonState();
      });
      betInput.addEventListener('blur', () => {
        if (state.betPerBall < 5) state.betPerBall = 5;
        betInput.value = state.betPerBall;
        updateDropButtonState();
        saveState();
        setTimeout(() => window.scrollTo(0, 0), 50);
      });

      // Быстрые кнопки ставки (Min, ½, 2×, Max — без верхнего потолка)
      document.querySelectorAll('.quick-bet-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (state.freeBetMode) return;
          audio.playClick();
          Haptic.light();
          const act = btn.dataset.betAct;
          if (act === 'min') {
            state.betPerBall = 5;
          } else if (act === 'half') {
            state.betPerBall = Math.max(5, Math.floor(state.betPerBall / 2));
          } else if (act === 'double') {
            state.betPerBall = Math.max(5, state.betPerBall * 2);
          } else if (act === 'max') {
            state.betPerBall = Math.max(5, Math.floor(state.balance / state.ballCount));
          }
          betInput.value = state.betPerBall;
          updateDropButtonState();
          saveState();
        });
      });

      // Выбор количества шариков (1 - 100)
      const slider = document.getElementById('balls-slider');
      slider.addEventListener('input', () => {
        state.ballCount = Math.max(1, Math.min(100, Number(slider.value) || 1));
        updateBallsUI();
      });
      slider.addEventListener('change', () => saveState());

      document.getElementById('balls-minus').addEventListener('click', () => {
        audio.playClick();
        Haptic.light();
        state.ballCount = Math.max(1, state.ballCount - 1);
        updateBallsUI();
        saveState();
      });

      document.getElementById('balls-plus').addEventListener('click', () => {
        audio.playClick();
        Haptic.light();
        state.ballCount = Math.min(100, state.ballCount + 1);
        updateBallsUI();
        saveState();
      });

      document.getElementById('balls-presets').addEventListener('click', e => {
        const chip = e.target.closest('.preset-chip');
        if (!chip) return;
        audio.playClick();
        Haptic.light();
        state.ballCount = Number(chip.dataset.balls);
        updateBallsUI();
        saveState();
      });

      // Главная кнопка запуска шариков
      document.getElementById('drop-btn').addEventListener('click', () => {
        audio.unlock();
        if (document.activeElement === betInput) betInput.blur();

        const count = state.ballCount;
        const isFree = Boolean(
          state.freeBetMode &&
          state.activeTicketNominal &&
          (state.tickets[state.activeTicketNominal] || 0) > 0
        );

        let betPerBall = 0;

        if (isFree) {
          const nominal = state.activeTicketNominal;
          state.tickets[nominal] = Math.max(0, (state.tickets[nominal] || 0) - 1);
          if (state.tickets[nominal] === 0) delete state.tickets[nominal];
          betPerBall = nominal / count;
          ensureValidFreeBetState();
        } else {
          if (state.betPerBall < 5) {
            state.betPerBall = 5;
            betInput.value = 5;
          }
          const totalCost = state.betPerBall * count;
          if (state.balance < totalCost) {
            showToast('Недостаточно средств на балансе', '⚠️');
            Haptic.light();
            return;
          }
          state.balance -= totalCost;
          state.stats.totalWagered += totalCost;
          betPerBall = state.betPerBall;
        }

        state.stats.roundsCount += 1;
        if (count > state.stats.maxBallsInRound) {
          state.stats.maxBallsInRound = count;
        }

        audio.playDrop(count);
        Haptic.medium();

        engine.launchRound({
          count,
          betPerBall,
          risk: state.risk,
          isFreeBet: isFree
        });

        animateBalanceTo(state.balance);
        updateBonusButtonVisibility();
        updateFreeBetUI();
        updateDropButtonState();
        checkQuestNotifications();
        saveState();
      });

      // Кнопка бонусного пополнения +20K (строго при балансе < $5,000)
      document.getElementById('bonus-btn').addEventListener('click', () => {
        if (state.balance >= 5000) return;
        audio.unlock();
        state.balance += 20000;
        audio.playCoinBonus();
        Haptic.success();
        animateBalanceTo(state.balance);
        updateBonusButtonVisibility();
        updateDropButtonState();
        showToast('Бонус +$20,000 зачислен на баланс!', '🎁');
        if (typeof confetti === 'function') {
          try {
            confetti({ particleCount: 45, spread: 60, origin: { y: 0.25 }, colors: ['#FCE38A', '#10B981', '#F5C542'] });
          } catch (_) {}
        }
        saveState();
      });

      // Кнопка заданий
      document.getElementById('quests-btn').addEventListener('click', () => {
        audio.playClick();
        Haptic.light();
        renderQuestsModal();
        openModal('quests-modal');
      });

      // Забор награды за задание
      document.getElementById('quests-list').addEventListener('click', e => {
        const btn = e.target.closest('[data-claim-quest]');
        if (!btn) return;
        claimQuestReward(btn.dataset.claimQuest);
      });

      // Переключатель звука (all -> sfx -> mute)
      document.getElementById('sound-btn').addEventListener('click', () => {
        audio.unlock();
        Haptic.light();
        const order = ['all', 'sfx', 'mute'];
        const nextIdx = (order.indexOf(state.soundMode) + 1) % order.length;
        state.soundMode = order[nextIdx];
        audio.setMode(state.soundMode);
        updateSoundIcon();
        const labels = { all: 'Звук и музыка вкл.', sfx: 'Только эффекты', mute: 'Звук выкл.' };
        showToast(labels[state.soundMode], state.soundMode === 'mute' ? '🔇' : '🔊');
        saveState();
      });

      // Открытие окна реальных игроков
      document.getElementById('online-trigger').addEventListener('click', () => {
        audio.playClick();
        Haptic.light();
        OnlineService.renderModalList();
        openModal('online-modal');
      });

      // Вкладки окна онлайн-игроков
      document.getElementById('online-tabs').addEventListener('click', e => {
        const tab = e.target.closest('.modal-tab');
        if (!tab) return;
        audio.playClick();
        Haptic.light();
        OnlineService.activeTab = tab.dataset.otab;
        document.querySelectorAll('#online-tabs .modal-tab').forEach(t => {
          t.classList.toggle('active', t === tab);
        });
        OnlineService.renderModalList();
      });

      // Закрытие модалок по крестику и клику по фону
      document.querySelectorAll('[data-close-modal]').forEach(btn => {
        btn.addEventListener('click', () => {
          audio.playClick();
          closeModal(btn.dataset.closeModal);
        });
      });

      document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', e => {
          if (e.target === backdrop) {
            closeModal(backdrop.id);
          }
        });
      });

      // Ресайз и жизненный цикл вкладки
      window.addEventListener('resize', () => {
        if (engine) engine.resize();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          audio.pauseBgm();
          if (engine) engine.stop();
          saveState();
        } else {
          audio.resumeBgm();
          if (engine) engine.start();
        }
      });

      const settleOnExit = () => {
        if (engine) engine.settleAllPendingImmediately();
      };
      window.addEventListener('pagehide', settleOnExit);
      window.addEventListener('beforeunload', settleOnExit);
    }

    /* ==========================================================================
       12. APPLICATION STARTUP (WINDOW ONLOAD)
       ========================================================================== */
    window.onload = function () {
      initTelegram();
      lockBrowserGestures();
      loadState();
      initProfileUI();
      syncAllUI();
      OnlineService.init();

      const canvas = document.getElementById('plinko-canvas');
      engine = new PlinkoEngine(canvas);
      bindEvents();
      engine.start();

      // Анимация прелоадера (0.9 сек)
      const splash = document.getElementById('splash-screen');
      const fill = document.getElementById('splash-fill');
      if (typeof gsap !== 'undefined') {
        gsap.to(fill, {
          width: '100%',
          duration: 0.75,
          ease: 'power2.inOut',
          onComplete: () => {
            gsap.to(splash, {
              opacity: 0,
              duration: 0.35,
              ease: 'power2.out',
              onComplete: () => { splash.style.display = 'none'; }
            });
          }
        });
      } else {
        fill.style.width = '100%';
        setTimeout(() => { splash.style.display = 'none'; }, 500);
      }
    };
  </script>
</body>
</html>
