<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070B10">
  <title>Plinko VIP — NVR</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- GSAP 3 для плавных UI-анимаций и счётчиков -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Canvas Confetti для джекпотов и наград -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Firebase Realtime Database (Compat SDK) для реального онлайна -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & GLOBAL RESET (NO BROWSER GARBAGE)
       ========================================================================== */
    :root {
      --bg-obsidian: #070B10;
      --bg-emerald: #0D1815;
      --glass-bg: rgba(13, 22, 26, 0.72);
      --glass-bg-strong: rgba(10, 17, 22, 0.88);
      --glass-border: rgba(245, 197, 66, 0.16);
      --glass-border-light: rgba(255, 255, 255, 0.08);

      --gold-1: #FCE38A;
      --gold-2: #F5C542;
      --gold-3: #D4AF37;
      --gold-4: #9E7B1B;

      --emerald-glow: #10B981;
      --emerald-bright: #34D399;
      --ruby-glow: #F43F5E;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;

      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --tg-sat: 0px;
      --tg-sab: 0px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Скрытие системных скроллбаров */
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar {
      display: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Убираем стандартные стрелки и обводки инпутов */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    button, input {
      font-family: inherit;
      outline: none;
      border: none;
      background: none;
      color: inherit;
    }
    input {
      user-select: text;
      -webkit-user-select: text;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       2. APP SHELL (STRICT PORTRAIT MOBILE / CENTERED CABINET ON DESKTOP)
       ========================================================================== */
    #app-shell {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      background:
        radial-gradient(ellipse 90% 55% at 50% 42%, rgba(16, 185, 129, 0.13) 0%, rgba(13, 24, 21, 0.55) 45%, rgba(7, 11, 16, 1) 100%),
        linear-gradient(180deg, #070B10 0%, #0D1815 52%, #070B10 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
    }

    @media (min-width: 500px) and (min-height: 600px) {
      #app-shell {
        height: min(100dvh, 920px);
        border-radius: 26px;
        border: 1px solid rgba(245, 197, 66, 0.18);
      }
    }

    /* Вспышка по краям экрана при джекпоте */
    #jackpot-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      box-shadow: inset 0 0 80px 18px rgba(245, 197, 66, 0.65);
    }

    /* ==========================================================================
       3. PRELOADER (SPLASH SCREEN)
       ========================================================================== */
    #splash-screen {
      position: absolute;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 45%, #11221E 0%, #070B10 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .splash-logo-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(245, 197, 66, 0.22), rgba(16, 185, 129, 0.1));
      border: 1.5px solid rgba(245, 197, 66, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 36px rgba(245, 197, 66, 0.28);
    }

    .splash-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #FFF3C4 0%, #F5C542 55%, #B8860B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .splash-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      color: rgba(245, 197, 66, 0.65);
      text-transform: uppercase;
    }

    .splash-bar {
      width: 120px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-top: 6px;
    }

    .splash-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-3), var(--gold-1));
      border-radius: 99px;
    }

    /* ==========================================================================
       4. HEADER (~52px + SAFE AREA TOP + ~20PX ADAPTIVE SPACING)
       ========================================================================== */
    .app-header {
      flex: 0 0 auto;
      padding: calc(max(var(--sat), var(--tg-sat)) + clamp(18px, 2.8dvh, 24px)) 12px 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      max-width: 34%;
    }

    .avatar-ring {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      padding: 1.5px;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-4));
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(245, 197, 66, 0.25);
    }

    .avatar-img, .avatar-initials {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #101D24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--gold-1);
    }

    .profile-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .profile-vip {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--gold-2);
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Баланс и кнопка +20K */
    .balance-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 auto;
      justify-content: center;
      min-width: 0;
    }

    .balance-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      max-width: 100%;
    }

    .balance-dollar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
      color: #070B10;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #balance-display {
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* Условная кнопка бонуса +20K (строго при balance < 5000) */
    #bonus-btn {
      display: none;
      align-items: center;
      gap: 3px;
      padding: 5px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, #10B981 0%, #D4AF37 100%);
      color: #04100C;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.2px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.55);
      animation: bonusPulse 1.6s infinite ease-in-out;
    }
    #bonus-btn.visible {
      display: inline-flex;
    }
    #bonus-btn:active {
      transform: scale(0.92);
    }

    @keyframes bonusPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.45); transform: scale(1); }
      50% { box-shadow: 0 0 18px rgba(245, 197, 66, 0.75); transform: scale(1.04); }
    }

    /* Кнопки действий в шапке */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border-light);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.2s ease;
    }
    .icon-btn:active {
      transform: scale(0.9);
    }
    .icon-btn.has-alert {
      border-color: rgba(245, 197, 66, 0.55);
    }

    .quest-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 99px;
      background: linear-gradient(135deg, #F43F5E, #F59E0B);
      color: #FFF;
      font-size: 9px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(244, 63, 94, 0.6);
    }
    .quest-badge.visible {
      display: flex;
    }

    /* ==========================================================================
       5. HISTORY STRIP (~28px)
       ========================================================================== */
    .history-bar {
      flex: 0 0 28px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      z-index: 15;
    }

    .history-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      flex-shrink: 0;
    }

    #history-chips {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      overflow: hidden;
    }

    .hist-chip {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.3;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* ==========================================================================
       6. GAME BOARD CANVAS (FLEXIBLE CENTRAL AREA)
       ========================================================================== */
    #board-container {
      position: relative;
      flex: 1 1 auto;
      min-height: 210px;
      width: 100%;
      overflow: hidden;
    }

    #plinko-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ==========================================================================
       7. CONTROLS PANEL (~195px, COMPACT GLASSMORPHISM)
       ========================================================================== */
    .controls-panel {
      flex: 0 0 auto;
      margin: 0 10px 4px 10px;
      padding: 9px 10px 10px 10px;
      border-radius: 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 20;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
    }

    /* Строка риска + фри-ставка */
    .ctrl-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .risk-segmented {
      display: flex;
      flex: 1;
      background: rgba(5, 9, 13, 0.75);
      border-radius: 10px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .risk-btn {
      flex: 1;
      padding: 5px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
    }
    .risk-btn.active {
      background: linear-gradient(180deg, rgba(245, 197, 66, 0.22), rgba(212, 175, 55, 0.12));
      color: var(--gold-1);
      box-shadow: inset 0 0 0 1px rgba(245, 197, 66, 0.45);
    }

    /* Переключатель фри-ставки */
    #freebet-toggle {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-radius: 10px;
      background: rgba(245, 197, 66, 0.12);
      border: 1px solid rgba(245, 197, 66, 0.4);
      color: var(--gold-1);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    #freebet-toggle.visible {
      display: inline-flex;
    }
    #freebet-toggle.active {
      background: linear-gradient(135deg, #FCE38A 0%, #D4AF37 100%);
      color: #070B10;
      box-shadow: 0 0 14px rgba(245, 197, 66, 0.5);
    }

    /* Строка ставки */
    .bet-row {
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s ease;
    }
    .bet-row.disabled {
      opacity: 0.42;
      pointer-events: none;
    }

    .bet-input-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      background: rgba(5, 9, 13, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0 9px;
      height: 34px;
      min-width: 0;
      transition: border-color 0.2s ease;
    }
    .bet-input-wrap:focus-within {
      border-color: rgba(245, 197, 66, 0.65);
    }

    .bet-currency {
      color: var(--gold-2);
      font-weight: 800;
      font-size: 13px;
      margin-right: 4px;
    }

    #bet-input {
      width: 100%;
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
      color: #FFFFFF;
      min-width: 0;
      touch-action: manipulation;
    }

    .bet-per-label {
      font-size: 9px;
      color: var(--text-dim);
      font-weight: 600;
      white-space: nowrap;
      margin-left: 4px;
    }

    .quick-bet-btn {
      height: 34px;
      padding: 0 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .quick-bet-btn:active {
      transform: scale(0.92);
      background: rgba(245, 197, 66, 0.2);
    }

    /* Строка количества шариков */
    .balls-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .balls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .balls-slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .step-btn {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .step-btn:active { transform: scale(0.9); }

    #balls-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }
    #balls-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
      border: 2px solid #070B10;
      box-shadow: 0 0 10px rgba(245, 197, 66, 0.65);
      cursor: pointer;
    }

    .balls-count-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-1);
      min-width: 56px;
      text-align: right;
    }

    .balls-presets {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .preset-chip {
      flex: 1;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preset-chip.active {
      background: rgba(245, 197, 66, 0.18);
      border-color: rgba(245, 197, 66, 0.5);
      color: var(--gold-1);
    }

    /* Главная золотая кнопка запуска */
    #drop-btn {
      width: 100%;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(180deg, #FCE38A 0%, #F5C542 45%, #C9971A 100%);
      color: #070B10;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow:
        0 4px 18px rgba(245, 197, 66, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    #drop-btn:active {
      transform: scale(0.975);
      filter: brightness(0.95);
    }
    #drop-btn.free-mode {
      background: linear-gradient(135deg, #34D399 0%, #F5C542 50%, #FCE38A 100%);
      box-shadow: 0 4px 22px rgba(52, 211, 153, 0.45);
    }
    #drop-btn.insufficient {
      background: linear-gradient(180deg, #334155 0%, #1E293B 100%);
      color: #94A3B8;
      box-shadow: none;
    }

    .drop-sub {
      font-size: 11px;
      font-weight: 800;
      opacity: 0.85;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(7, 11, 16, 0.14);
    }

    /* ==========================================================================
       8. FOOTER BAR (~26px + SAFE AREA BOTTOM)
       ========================================================================== */
    .app-footer {
      flex: 0 0 auto;
      padding: 2px 14px calc(max(var(--sab), var(--tg-sab)) + 6px) 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    #online-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 8px 3px 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    #online-trigger:active {
      transform: scale(0.95);
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-glow);
      box-shadow: 0 0 8px var(--emerald-glow);
      animation: dotPulse 2s infinite;
    }
    .online-dot.offline {
      background: #64748B;
      box-shadow: none;
      animation: none;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .dev-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(245, 197, 66, 0.45);
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(245, 197, 66, 0.05);
      border: 1px solid rgba(245, 197, 66, 0.1);
    }

    /* ==========================================================================
       9. TOAST NOTIFICATIONS
       ========================================================================== */
    #toast-container {
      position: absolute;
      top: calc(max(var(--sat), var(--tg-sat)) + 84px);
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;

  <script>
    'use strict';

    /* ==========================================================================
       КОНФИГУРАЦИЯ FIREBASE REALTIME DATABASE (РЕАЛЬНЫЙ ОНЛАЙН БЕЗ БОТОВ)
       Вставьте ваши ключи из Firebase Console -> Project Settings -> Web App.
       Если оставить поля пустыми, игра будет работать автономно и показывать
       честный статус онлайна без какой-либо имитации ботов.
       ========================================================================== */
    const FIREBASE_CONFIG = {
      apiKey: "",
      authDomain: "",
      databaseURL: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    /* ==========================================================================
       1. TELEGRAM WEBAPP INTEGRATION & GESTURE LOCK
       ========================================================================== */
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id
      ? tg.initDataUnsafe.user
      : null;

    function initTelegram() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
        if (typeof tg.requestFullscreen === 'function') {
          try { tg.requestFullscreen(); } catch (_) {}
        }
        if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#070B10');
        if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#070B10');

        const updateSafeInsets = () => {
          const topInset = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) ||
                           (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
          const bottomInset = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.bottom) ||
                              (tg.safeAreaInset && tg.safeAreaInset.bottom) || 0;
          document.documentElement.style.setProperty('--tg-sat', topInset + 'px');
          document.documentElement.style.setProperty('--tg-sab', bottomInset + 'px');
        };
        updateSafeInsets();
        if (typeof tg.onEvent === 'function') {
          tg.onEvent('safeAreaChanged', updateSafeInsets);
          tg.onEvent('contentSafeAreaChanged', updateSafeInsets);
        }
      } catch (err) {
        console.warn('Telegram WebApp init warning:', err);
      }
    }

    const Haptic = {
      light() {
        try { tg?.HapticFeedback?.impactOccurred('light'); } catch (_) {}
      },
      medium() {
        try { tg?.HapticFeedback?.impactOccurred('medium'); } catch (_) {}
      },
      success() {
        try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (_) {}
      }
    };

    /* Блокировка зума, контекстного меню и системных жестов */
    function lockBrowserGestures() {
      document.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });
      document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouchEnd <= 280) {
          if (!e.target.closest('input') && !e.target.closest('button')) {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) {
          e.preventDefault();
          return;
        }
        if (!e.target.closest('.scrollable-list') && e.target.id !== 'balls-slider') {
          e.preventDefault();
        }
      }, { passive: false });
    }

    /* ==========================================================================
       2. FORMATTING UTILITIES
       ========================================================================== */
    function formatMoney(val) {
      const n = Math.floor(Number(val) || 0);
      return n.toLocaleString('en-US');
    }

    function formatCompact(val) {
      const n = Number(val) || 0;
      if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
      if (n >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return formatMoney(n);
    }

    function formatRelativeTime(ts) {
      if (!ts) return '';
      const diff = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diff < 30) return 'только что';
      if (diff < 60) return `${diff} сек назад`;
      const mins = Math.floor(diff / 60);
      if (mins < 60) return `${mins} мин назад`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs} ч назад`;
      return `${Math.floor(hrs / 24)} дн назад`;
    }

    function pluralBalls(n) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return `${n} шар`;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return `${n} шара`;
      return `${n} шаров`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* Безопасная отрисовка скруглённого прямоугольника (для старых WebView) */
    function drawRoundedRect(ctx, x, y, w, h, r) {
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      const rad = Math.min(r, w * 0.5, h * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    /* ==========================================================================
       3. AUDIO ENGINE (PROCEDURAL WEB AUDIO API + POLYPHONY THROTTLING)
       ========================================================================== */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.compressor = null;
        this.bgmGain = null;
        this.sfxGain = null;
        this.mode = 'all'; // 'all' | 'sfx' | 'mute'
        this.unlocked = false;
        this.bgmTimer = null;
        this.bgmStep = 0;

        // Ограничитель полифонии для 100 шариков
        this.lastPlinkTime = 0;
        this.activePlinks = 0;
        this.maxPlinks = 12;
      }

      unlock() {
        if (this.unlocked) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          this.compressor = this.ctx.createDynamicsCompressor();
          this.compressor.threshold.setValueAtTime(-14, this.ctx.currentTime);
          this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
          this.compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
          this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
          this.compressor.release.setValueAtTime(0.12, this.ctx.currentTime);

          this.masterGain = this.ctx.createGain();
          this.bgmGain = this.ctx.createGain();
          this.sfxGain = this.ctx.createGain();

          this.bgmGain.connect(this.compressor);
          this.sfxGain.connect(this.compressor);
          this.compressor.connect(this.masterGain);
          this.masterGain.connect(this.ctx.destination);

          this.unlocked = true;
          this.applyMode();
          this.startBgm();
        } catch (err) {
          console.warn('Audio init failed:', err);
        }
      }

      setMode(mode) {
        this.mode = mode;
        this.applyMode();
      }

      applyMode() {
        if (!this.unlocked || !this.ctx) return;
        const now = this.ctx.currentTime;
        if (this.mode === 'mute') {
          this.bgmGain.gain.setTargetAtTime(0.0001, now, 0.05);
          this.sfxGain.gain.setTargetAtTime(0.0001, now, 0.05);
        } else if (this.mode === 'sfx') {
          this.bgmGain.gain.setTargetAtTime(0.0001, now, 0.05);
          this.sfxGain.gain.setTargetAtTime(0.85, now, 0.05);
        } else {
          this.bgmGain.gain.setTargetAtTime(0.22, now, 0.08);
          this.sfxGain.gain.setTargetAtTime(0.85, now, 0.05);
        }
      }

      pauseBgm() {
        if (this.ctx && this.ctx.state === 'running') {
          this.ctx.suspend().catch(() => {});
        }
      }

      resumeBgm() {
        if (this.unlocked && this.ctx && this.ctx.state === 'suspended' && this.mode !== 'mute') {
          this.ctx.resume().catch(() => {});
        }
      }

      /* Мягкий лаунж / deep-casino бит в стиле VIP-зала */
      startBgm() {
        if (this.bgmTimer) return;
        const chords = [
          [146.83, 220.00, 261.63, 329.63], // Dm9
          [116.54, 174.61, 220.00, 293.66], // Bbmaj7
          [98.00,  174.61, 233.08, 293.66], // Gm9
          [110.00, 164.81, 207.65, 261.63]  // A7
        ];
        const stepMs = 460;

        this.bgmTimer = setInterval(() => {
          if (!this.unlocked || !this.ctx || this.ctx.state !== 'running' || this.mode !== 'all' || document.hidden) return;
          const now = this.ctx.currentTime;
          const step = this.bgmStep % 16;
          const chordIdx = Math.floor(step / 4);
          const chord = chords[chordIdx];

          if (step % 4 === 0) {
            chord.forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = i === 0 ? 'triangle' : 'sine';
              osc.frequency.setValueAtTime(freq, now);

              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(i === 0 ? 0.14 : 0.055, now + 0.06);
              gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.75);

              osc.connect(gain);
              gain.connect(this.bgmGain);
              osc.start(now);
              osc.stop(now + 1.8);
            });
          }

          if (step % 2 === 0) {
            const bass = this.ctx.createOscillator();
            const bg = this.ctx.createGain();
            bass.type = 'sine';
            bass.frequency.setValueAtTime(chord[0] * 0.5, now);
            bg.gain.setValueAtTime(0.0001, now);
            bg.gain.linearRampToValueAtTime(0.16, now + 0.02);
            bg.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            bass.connect(bg);
            bg.connect(this.bgmGain);
            bass.start(now);
            bass.stop(now + 0.36);
          }

          if (step % 2 === 1) {
            const bufferSize = Math.floor(this.ctx.sampleRate * 0.03);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const hp = this.ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(7500, now);

            const ng = this.ctx.createGain();
            ng.gain.setValueAtTime(0.032, now);

            noise.connect(hp);
            hp.connect(ng);
            ng.connect(this.bgmGain);
            noise.start(now);
          }

          this.bgmStep++;
        }, stepMs);
      }

      playClick() {
        if (!this.unlocked || this.mode === 'mute' || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.045);
        g.gain.setValueAtTime(0.12, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(g);
        g.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      playDrop(count) {
        if (!this.unlocked || this.mode === 'mute' || !this.ctx) return;
        const now = this.ctx.currentTime;
        const taps = Math.min(count, 6);
        for (let i = 0; i < taps; i++) {
          const t = now + i * 0.035;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(420 + i * 45, t);
          osc.frequency.exponentialRampToValueAtTime(220, t + 0.06);
          g.gain.setValueAtTime(0.11, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.07);
        }
      }

      /* Кристально-металлический «плинк» с ростом pitch по рядам и троттлингом */
      playPinHit(row) {
        if (!this.unlocked || this.mode === 'mute' || !this.ctx) return;
        const nowMs = performance.now();
        if (nowMs - this.lastPlinkTime < 28 || this.activePlinks >= this.maxPlinks) return;
        this.lastPlinkTime = nowMs;
        this.activePlinks++;

        const now = this.ctx.currentTime;
        const baseFreq = 580 + row * 48 + (Math.random() * 24 - 12);
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.06, now + 0.055);

        g.gain.setValueAtTime(0.085, now);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.065);

        osc.connect(g);
        g.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.07);
        osc.onended = () => { this.activePlinks = Math.max(0, this.activePlinks - 1); };
      }

      playBucketHit(mult) {
        if (!this.unlocked || this.mode === 'mute' || !this.ctx) return;
        const now = this.ctx.currentTime;

        if (mult < 1) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.11);
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (mult < 10) {
          [523.25, 659.25].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + idx * 0.03);
            g.gain.setValueAtTime(0.12, now + idx * 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.22 + idx * 0.03);
            osc.connect(g);
            g.connect(this.sfxGain);
            osc.start(now + idx * 0.03);
            osc.stop(now + 0.25 + idx * 0.03);
          });
        } else {
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          notes.forEach((f, idx) => {
            const t = now + idx * 0.055;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(0.18, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.connect(g);
            g.connect(this.sfxGain);
            osc.start(t);
            osc.stop(t + 0.48);
          });
        }
      }

      playCoinBonus() {
        if (!this.unlocked || this.mode === 'mute' || !this.ctx) return;
        const now = this.ctx.currentTime;
        [880, 1174.66, 1396.91, 1760].forEach((f, i) => {
          const t = now + i * 0.055;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.15, t);

          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.32);
        });
      }
